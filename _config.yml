# Site settings
title: "Ender Kuş"
tagline: "Developer · System Admin · Book Author · Volunteer Trainer"
description: "Back-end developer with 10+ years of experience building and scaling PHP/Laravel and Ruby on Rails applications for e-commerce, real estate, and insurance clients."
email: "ender@enderkus.com.tr"
author: "Ender Kuş"

# Custom domain, served at the root: no baseurl subpath needed.
url: "https://enderkus.com"
baseurl: ""

# Social links: leave blank if unused, the include hides it automatically
social:
  twitter: "coderbiri"
  linkedin: "ender-k-16540a22a"
  github: "enderkus"
  website: ""
  website_label: ""

# Kit (formerly ConvertKit) subscription form.
# Create your form in Kit under Grow > Landing Pages & Forms, grab it as
# "Embed" > "Embed script", and paste the uid/src here. Rendered in
# _includes/signup.html (local override of the theme's default).
convertkit:
  uid: "45f02c29cb"
  script_src: "https://ender-kus.kit.com/45f02c29cb/index.js"

permalink: /:title/

theme: jekyll-theme-colophon

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
